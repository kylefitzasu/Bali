<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globe Test</title>
<style>
  body { background:#f5f5f0; display:flex; justify-content:center; padding:20px; font-family:sans-serif; margin:0; }
  #gw{display:flex;flex-direction:column;align-items:center;gap:14px;}
  #ginfo{text-align:center;min-height:50px;}
  #gname{font-size:20px;font-weight:600;color:#1a4a4a;margin:0 0 4px;}
  #gdate{font-size:13px;color:#7a7060;margin:0;letter-spacing:1px;}
  #gctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .gbtn{font-size:12px;padding:7px 18px;border-radius:8px;border:1px solid #ccc;background:white;color:#1a4a4a;cursor:pointer;}
  .gbtn:hover{background:#f0f0ec;}
  #gleg{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .gli{display:flex;align-items:center;gap:6px;font-size:12px;color:#7a7060;}
  .gld{width:10px;height:10px;border-radius:50%;}
</style>
</head>
<body>
<div id="gw">
  <div id="ginfo">
    <p id="gname">Denver, CO</p>
    <p id="gdate">Departs May 13</p>
  </div>
  <canvas id="gc" width="480" height="480" style="border-radius:50%;display:block;"></canvas>
  <div id="gctrl">
    <button class="gbtn" id="gbplay">⏸ Pause</button>
    <button class="gbtn" id="gbrestart">↺ Restart</button>
    <span style="font-size:12px;color:#7a7060;">Speed</span>
    <input type="range" id="gbspeed" min="0.5" max="6" step="0.5" value="1.5" style="width:80px;">
  </div>
  <div id="gleg">
    <div class="gli"><div class="gld" style="background:#E8B85A;"></div>Outbound</div>
    <div class="gli"><div class="gld" style="background:#7EC8E3;"></div>Return</div>
    <div class="gli"><div class="gld" style="background:#FF6B6B;"></div>Plane</div>
    <div class="gli"><div class="gld" style="background:#90EE90;"></div>Visited</div>
  </div>
</div>
<script>
const C=document.getElementById('gc');
const X=C.getContext('2d');
const W=480,H=480,CX=240,CY=240,R=210;

const STOPS=[
  {n:"Denver, CO",       d:"Departs May 13",  la:39.74, lo:-104.99, t:"out"},
  {n:"San Francisco, CA",d:"Layover May 13",  la:37.77, lo:-122.42, t:"out"},
  {n:"Taipei, Taiwan",   d:"Layover May 15",  la:25.03, lo:121.57,  t:"out"},
  {n:"Hong Kong",        d:"May 15–18",       la:22.32, lo:114.17,  t:"out"},
  {n:"Singapore",        d:"Layover May 18",  la:1.35,  lo:103.82,  t:"out"},
  {n:"Bali, Indonesia",  d:"May 18–23",       la:-8.34, lo:115.09,  t:"out"},
  {n:"Taipei, Taiwan",   d:"Layover May 23",  la:25.03, lo:121.57,  t:"ret"},
  {n:"Los Angeles, CA",  d:"Overnight May 23",la:34.05, lo:-118.24, t:"ret"},
  {n:"Denver, CO",       d:"Arrives May 24",  la:39.74, lo:-104.99, t:"ret"},
];

// Continent polygons [lon, lat]
const CONTINENTS = [
  // North America
  { c:'#3d7a4a', segs: [
    [[-168,72],[-140,70],[-120,68],[-95,74],[-85,73],[-75,68],[-65,63],[-60,47],[-66,44],[-70,42],[-75,35],[-81,25],[-83,10],[-77,8],[-83,10],[-88,16],[-90,15],[-100,19],[-104,19],[-110,23],[-117,32],[-120,34],[-124,40],[-124,49],[-110,49],[-95,49],[-88,48],[-84,46],[-83,42],[-79,43],[-75,44],[-72,45],[-66,45],[-60,47],[-65,63],[-75,68],[-85,73],[-95,74],[-120,68],[-140,70],[-168,72]],
    [[-152,60],[-145,60],[-138,58],[-134,58],[-130,54],[-124,49],[-130,54],[-138,58],[-145,60],[-152,60]],
  ]},
  // Greenland
  { c:'#4a8a5a', segs: [[[-44,84],[-20,83],[-18,70],[-26,65],[-44,62],[-52,66],[-56,72],[-50,82],[-44,84]]] },
  // South America
  { c:'#3d7a4a', segs: [[
    [-82,8],[-77,4],[-62,2],[-50,0],[-35,-5],[-35,-10],[-38,-18],[-42,-22],[-44,-23],[-48,-26],[-50,-28],[-51,-30],[-51,-34],[-58,-38],[-62,-38],[-65,-42],[-66,-52],[-68,-54],[-70,-52],[-72,-46],[-74,-38],[-72,-28],[-70,-18],[-75,-10],[-80,0],[-77,4],[-82,8]
  ]]},
  // Europe
  { c:'#3d7a4a', segs: [[
    [-10,36],[0,36],[8,38],[15,38],[18,40],[24,38],[28,38],[30,42],[30,46],[26,46],[22,46],[18,46],[14,46],[10,47],[6,47],[2,51],[-2,51],[-5,48],[-8,44],[-10,38],[-10,36]
  ]]},
  // Scandinavia
  { c:'#3d7a4a', segs: [[
    [4,58],[8,58],[10,58],[14,56],[20,56],[26,60],[28,64],[30,68],[26,70],[20,70],[16,68],[14,64],[10,58],[4,58]
  ]]},
  // Africa
  { c:'#3d7a4a', segs: [[
    [-18,16],[-16,12],[-15,5],[-8,4],[0,5],[8,4],[10,2],[14,4],[16,2],[20,2],[26,0],[30,-2],[34,-5],[38,-10],[36,-18],[34,-22],[30,-30],[26,-34],[18,-34],[14,-30],[12,-22],[8,-14],[4,-8],[2,4],[0,8],[4,12],[8,14],[14,16],[20,22],[24,20],[30,20],[36,22],[38,18],[42,12],[44,8],[48,10],[50,8],[46,4],[40,2],[36,-2],[34,-8],[38,-10],[36,-18],[30,-30],[26,-34],[18,-34],[14,-30],[12,-22],[8,-14],[4,-8],[2,4],[0,8],[-5,5],[-15,5],[-16,12],[-18,16]
  ]]},
  // Asia main
  { c:'#3d7a4a', segs: [[
    [26,42],[30,42],[36,36],[40,36],[44,38],[50,38],[58,34],[60,28],[62,22],[68,22],[72,22],[76,28],[80,28],[84,26],[88,26],[90,20],[96,20],[100,5],[104,2],[108,2],[110,2],[112,-2],[110,-6],[108,-6],[106,-6],[104,2],[100,5],[96,20],[90,20],[88,26],[84,26],[80,28],[76,28],[72,22],[68,22],[62,22],[60,24],[58,28],[56,30],[52,30],[48,30],[44,36],[40,36],[36,36],[30,42],[26,42]
  ],[
    [90,42],[100,40],[110,42],[120,46],[130,42],[135,35],[130,33],[122,32],[118,24],[114,22],[108,22],[104,26],[96,28],[90,34],[84,34],[78,34],[72,34],[68,36],[62,36],[56,38],[60,42],[70,42],[80,40],[90,40],[100,40],[90,42]
  ]]},
  // Southeast Asia peninsulas
  { c:'#3d7a4a', segs: [[
    [100,5],[102,2],[104,2],[108,2],[108,6],[106,12],[104,14],[100,14],[98,18],[96,20],[100,5]
  ]]},
  // Japan
  { c:'#3d7a4a', segs: [[
    [130,32],[132,34],[134,36],[136,36],[138,38],[140,40],[141,44],[140,45],[136,44],[134,38],[132,34],[130,32]
  ]]},
  // Indonesia (Sumatra + Java + Borneo + Sulawesi)
  { c:'#3d7a4a', segs: [
    [[96,4],[98,2],[100,0],[104,-2],[106,-6],[108,-6],[108,-8],[104,-6],[100,-2],[96,2],[96,4]],
    [[108,-6],[110,-6],[114,-8],[116,-8],[116,-10],[112,-10],[108,-8],[108,-6]],
    [[108,2],[112,2],[116,2],[118,0],[116,-4],[112,-4],[108,0],[108,2]],
    [[122,-2],[126,-2],[128,-4],[128,-6],[124,-6],[122,-4],[122,-2]],
  ]},
  // Philippines
  { c:'#3d7a4a', segs: [[
    [118,10],[120,10],[122,12],[122,16],[120,18],[118,16],[116,14],[118,10]
  ]]},
  // Australia
  { c:'#3d7a4a', segs: [[
    [114,-22],[118,-20],[122,-18],[128,-14],[132,-12],[136,-12],[138,-12],[142,-12],[146,-18],[150,-22],[152,-26],[152,-30],[150,-38],[146,-38],[142,-38],[138,-36],[132,-32],[128,-32],[124,-34],[120,-34],[114,-34],[112,-26],[114,-22]
  ]]},
  // New Zealand
  { c:'#3d7a4a', segs: [[
    [168,-46],[172,-44],[174,-42],[174,-38],[172,-36],[168,-40],[166,-44],[168,-46]
  ]]},
  // UK
  { c:'#3d7a4a', segs: [[
    [-6,50],[-2,50],[2,52],[-2,52],[-4,56],[-6,58],[-4,56],[-2,52],[-6,50]
  ]]},
  // Iceland
  { c:'#4a8a5a', segs: [[
    [-24,64],[-14,64],[-12,66],[-20,66],[-24,64]
  ]]},
];

let rotLon = -104.99 + 15;
let gt=0, playing=true, spd=1.5, lastTs=null;
const STEPS=300, TOTAL=(STOPS.length-1)*STEPS;

function toRad(d){return d*Math.PI/180;}

function project(lat, lon, rLon){
  const φ=toRad(lat);
  const λ=toRad(lon - rLon);
  const cosφ=Math.cos(φ);
  const x = cosφ * Math.sin(λ);
  const y = -Math.sin(φ);
  const z = cosφ * Math.cos(λ);
  return { x: CX + R*x, y: CY + R*y, z: z };
}

function slerp(la1,lo1,la2,lo2,f){
  const r=toRad;
  const v1=[Math.cos(r(la1))*Math.cos(r(lo1)),Math.cos(r(la1))*Math.sin(r(lo1)),Math.sin(r(la1))];
  const v2=[Math.cos(r(la2))*Math.cos(r(lo2)),Math.cos(r(la2))*Math.sin(r(lo2)),Math.sin(r(la2))];
  let dot=v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2];
  dot=Math.max(-1,Math.min(1,dot));
  const Ω=Math.acos(dot);
  if(Ω<1e-5)return{lat:la1,lon:lo1};
  const s=Math.sin(Ω);
  const a=Math.sin((1-f)*Ω)/s, b=Math.sin(f*Ω)/s;
  const rx=a*v1[0]+b*v2[0], ry=a*v1[1]+b*v2[1], rz=a*v1[2]+b*v2[2];
  return{
    lat:Math.atan2(rz,Math.sqrt(rx*rx+ry*ry))*180/Math.PI,
    lon:Math.atan2(ry,rx)*180/Math.PI
  };
}

function drawGlobe(){
  X.clearRect(0,0,W,H);

  // Ocean
  const og=X.createRadialGradient(CX-55,CY-55,15,CX,CY,R);
  og.addColorStop(0,'#1e5799');
  og.addColorStop(1,'#0a1f3c');
  X.beginPath(); X.arc(CX,CY,R,0,Math.PI*2);
  X.fillStyle=og; X.fill();

  // Clip to sphere
  X.save();
  X.beginPath(); X.arc(CX,CY,R,0,Math.PI*2); X.clip();

  // Grid
  X.strokeStyle='rgba(255,255,255,0.07)'; X.lineWidth=0.5;
  for(let la=-75;la<=75;la+=15){
    X.beginPath(); let fst=true;
    for(let lo=-180;lo<=180;lo+=3){
      const p=project(la,lo,rotLon);
      if(p.z>0){fst?X.moveTo(p.x,p.y):X.lineTo(p.x,p.y);fst=false;}else fst=true;
    }
    X.stroke();
  }
  for(let lo=-180;lo<180;lo+=15){
    X.beginPath(); let fst=true;
    for(let la=-88;la<=88;la+=3){
      const p=project(la,lo,rotLon);
      if(p.z>0){fst?X.moveTo(p.x,p.y):X.lineTo(p.x,p.y);fst=false;}else fst=true;
    }
    X.stroke();
  }

  // Continents
  CONTINENTS.forEach(({c,segs})=>{
    segs.forEach(poly=>{
      X.beginPath();
      let fst=true, lastVis=false;
      poly.forEach(([lo,la])=>{
        const p=project(la,lo,rotLon);
        if(p.z>0.02){
          if(fst||!lastVis) X.moveTo(p.x,p.y); else X.lineTo(p.x,p.y);
          fst=false; lastVis=true;
        } else { lastVis=false; }
      });
      X.closePath();
      X.fillStyle=c; X.fill();
      X.strokeStyle='rgba(120,200,130,0.25)'; X.lineWidth=0.5; X.stroke();
    });
  });

  X.restore();

  const seg=Math.floor(gt/STEPS), frac=(gt%STEPS)/STEPS;

  // Completed arcs
  for(let i=0;i<seg&&i<STOPS.length-1;i++) drawArc(STOPS[i],STOPS[i+1],1);
  // Active arc
  if(seg<STOPS.length-1) drawArc(STOPS[seg],STOPS[seg+1],frac);

  // Stop dots
  STOPS.forEach((s,i)=>{
    const p=project(s.la,s.lo,rotLon);
    if(p.z<=0.05) return;
    X.beginPath(); X.arc(p.x,p.y,5,0,Math.PI*2);
    X.fillStyle=i<=seg?'#90EE90':'rgba(255,255,255,0.3)'; X.fill();
    X.strokeStyle='rgba(255,255,255,0.85)'; X.lineWidth=1.5; X.stroke();
  });

  // Plane
  if(seg<STOPS.length-1){
    const cur=slerp(STOPS[seg].la,STOPS[seg].lo,STOPS[seg+1].la,STOPS[seg+1].lo,frac);
    const nxt=slerp(STOPS[seg].la,STOPS[seg].lo,STOPS[seg+1].la,STOPS[seg+1].lo,Math.min(1,frac+0.02));
    const pc=project(cur.lat,cur.lon,rotLon);
    const pn=project(nxt.lat,nxt.lon,rotLon);
    if(pc.z>0.05){
      const ang=Math.atan2(pn.y-pc.y,pn.x-pc.x);
      X.save(); X.translate(pc.x,pc.y); X.rotate(ang);
      X.font='20px serif'; X.fillText('✈',-10,7); X.restore();
      X.beginPath(); X.arc(pc.x,pc.y,13,0,Math.PI*2);
      X.strokeStyle='rgba(255,80,80,0.7)'; X.lineWidth=2; X.stroke();
    }
  } else {
    const p=project(STOPS[STOPS.length-1].la,STOPS[STOPS.length-1].lo,rotLon);
    if(p.z>0.05){ X.font='20px serif'; X.fillText('🏠',p.x-10,p.y+7); }
  }

  // Shine
  X.save();
  X.beginPath(); X.arc(CX,CY,R,0,Math.PI*2); X.clip();
  const sh=X.createRadialGradient(CX-70,CY-70,5,CX-70,CY-70,175);
  sh.addColorStop(0,'rgba(255,255,255,0.12)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  X.fillStyle=sh; X.fillRect(0,0,W,H);
  X.restore();

  // Rim
  X.beginPath(); X.arc(CX,CY,R,0,Math.PI*2);
  X.strokeStyle='rgba(255,255,255,0.2)'; X.lineWidth=1.5; X.stroke();
}

function drawArc(s1,s2,maxF){
  const col=s1.t==='out'?'rgba(232,184,90,0.9)':'rgba(126,200,227,0.9)';
  X.strokeStyle=col; X.lineWidth=2.5; X.setLineDash([6,5]);
  X.beginPath(); let first=true;
  const steps=80;
  for(let i=0;i<=steps;i++){
    const f=(i/steps)*maxF;
    const pos=slerp(s1.la,s1.lo,s2.la,s2.lo,f);
    const p=project(pos.lat,pos.lon,rotLon);
    if(p.z>0){ first?X.moveTo(p.x,p.y):X.lineTo(p.x,p.y); first=false; }
    else first=true;
  }
  X.stroke(); X.setLineDash([]);
}

function updateInfo(){
  const seg=Math.floor(gt/STEPS);
  const idx=Math.min(seg,STOPS.length-1);
  const s=STOPS[idx];
  document.getElementById('gname').textContent=s.n;
  document.getElementById('gdate').textContent=s.d;
  const nextIdx=Math.min(idx+1,STOPS.length-1);
  const target=STOPS[nextIdx].lo-20;
  const diff=((target-rotLon+540)%360)-180;
  rotLon+=diff*0.012;
}

function loop(ts){
  if(!lastTs) lastTs=ts;
  const dt=(ts-lastTs)/1000; lastTs=ts;
  if(playing&&gt<TOTAL){ gt=Math.min(TOTAL,gt+dt*60*spd); updateInfo(); }
  drawGlobe();
  requestAnimationFrame(loop);
}

document.getElementById('gbplay').addEventListener('click',function(){
  playing=!playing;
  this.textContent=playing?'⏸ Pause':'▶ Play';
});
document.getElementById('gbrestart').addEventListener('click',function(){
  gt=0; rotLon=-104.99+15; playing=true; lastTs=null;
  document.getElementById('gbplay').textContent='⏸ Pause';
});
document.getElementById('gbspeed').addEventListener('input',function(){
  spd=parseFloat(this.value);
});

requestAnimationFrame(loop);
</script>
</body>
</html>
